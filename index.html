<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Welcome</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: system-ui, sans-serif;
  }
  
  /* الخلفية الدائمة (تظهر بعد انتهاء الترحيب) */
  .home-bg {
    position: fixed; inset: 0;
    background: #000;
    z-index: 1;
  }
  
  /* ===== الشاشة الترحيبية ===== */
  .overlay {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, #0a0a1a 0%, #000 75%);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    z-index: 9999;
    transition: opacity 1s ease, visibility 1s ease;
  }
  
  .overlay.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  
  /* ===== حاوية الشعار ===== */
  .logo-wrap {
    opacity: 0;
    transform: translateY(40px) scale(0.7);
    animation:
      logoEnter 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards,
      logoFloat 3.5s ease-in-out 1.8s infinite;
  }
  
  /* الحاوية الداخلية لضبط اللمعة داخل حدود الصورة */
  .logo-inner {
    position: relative;
    display: inline-block;
    overflow: hidden;
    border-radius: 18px;
    animation: logoGlow 2.5s ease-in-out 1.8s infinite;
  }
  
  .logo-inner img {
    display: block;
    max-width: 70vw;
    max-height: 55vh;
  }
  
  /* لمعة الضوء الماسحة */
  .shine {
    position: absolute;
    top: 0; left: -120%;
    width: 60%; height: 100%;
    background: linear-gradient(
      100deg,
      transparent 10%,
      rgba(255,255,255,0.55) 50%,
      transparent 90%
    );
    transform: skewX(-22deg);
    animation: shineSweep 3s ease-in-out 2s infinite;
    pointer-events: none;
    mix-blend-mode: overlay;
  }
  
  /* ===== الجزيئات ===== */
  .particles {
    position: absolute; inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  
  .particle {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    animation-name: floatUp;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  
  /* ===== الحركات ===== */
  @keyframes logoEnter {
    0%   { opacity: 0; transform: translateY(40px) scale(0.7); }
    60%  { opacity: 1; transform: translateY(-6px) scale(1.05); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  
  @keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }
  
  @keyframes logoGlow {
    0%, 100% {
      box-shadow:
        0 0 25px rgba(126, 200, 255, 0.35),
        0 0 60px rgba(126, 200, 255, 0.15);
    }
    50% {
      box-shadow:
        0 0 45px rgba(126, 200, 255, 0.75),
        0 0 100px rgba(126, 200, 255, 0.35);
    }
  }
  
  @keyframes shineSweep {
    0%        { left: -120%; }
    50%, 100% { left: 130%; }
  }
  
  @keyframes floatUp {
    0%   { opacity: 0; transform: translateY(0) scale(0.4); }
    20%  { opacity: 0.9; }
    80%  { opacity: 0.5; }
    100% { opacity: 0; transform: translateY(-110vh) scale(1.3); }
  }
  
  /* ===== مرحلة الخروج ===== */
  .overlay.exiting .logo-wrap {
    animation: logoExit 1s cubic-bezier(0.55, 0, 0.68, 0.19) forwards !important;
  }
  
  @keyframes logoExit {
    0%   { opacity: 1; transform: scale(1);    filter: blur(0); }
    100% { opacity: 0; transform: scale(1.35); filter: blur(10px); }
  }
</style>
</head>
<body>

<div class="home-bg"></div>

<div class="overlay" id="overlay">
  <div class="particles" id="particles"></div>
  <div class="logo-wrap">
    <div class="logo-inner">
      <img src="logo.png" alt="Logo">
      <div class="shine"></div>
    </div>
  </div>
</div>

VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV"></audio>

<script>
  // ====== الإعدادات ======
  const CONFIG = {
    fallbackExitMs: 8500,   // وقت الخروج الاحتياطي (إن فشل الصوت)
    fadeOutMs: 1000,        // مدة التلاشي النهائي
    redirectURL: null       // رابط اختياري بعد الانتهاء
  };
  // ======================

  const overlay = document.getElementById('overlay');
  const audio   = document.getElementById('welcomeAudio');
  let hasExited = false;

  // --- توليد الجزيئات ---
  function createParticles() {
    const container = document.getElementById('particles');
    const colors = ['#ffffff', '#7ec8ff', '#ffd966', '#a78bfa'];
    for (let i = 0; i < 35; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 2 + Math.random() * 5;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + '%';
      p.style.bottom = '-10px';
      const color = colors[Math.floor(Math.random() * colors.length)];
      p.style.background = `radial-gradient(circle, ${color}, transparent 70%)`;
      p.style.animationDuration = (6 + Math.random() * 6) + 's';
      p.style.animationDelay = (Math.random() * 4) + 's';
      container.appendChild(p);
    }
  }

  // --- بدء الخروج ---
  function triggerExit() {
    if (hasExited) return;
    hasExited = true;
    overlay.classList.add('exiting');
    setTimeout(() => {
      overlay.classList.add('hide');
      if (CONFIG.redirectURL) window.location.href = CONFIG.redirectURL;
    }, CONFIG.fadeOutMs);
  }

  // --- التشغيل ---
  function start() {
    createParticles();

    const playPromise = audio.play();
    if (playPromise !== undefined) {
      playPromise
        .then(() => console.log('✓ الصوت يعمل'))
        .catch(err => console.warn('⚠ منع التشغيل التلقائي:', err));
    }

    // مؤقت احتياطي في حال فشل حدث onended
    setTimeout(triggerExit, CONFIG.fallbackExitMs);
  }

  // --- أحداث الصوت ---
  audio.addEventListener('ended', triggerExit);
  audio.addEventListener('error', (e) => console.warn('خطأ في الصوت:', e));

  // --- الإقلاع ---
  window.addEventListener('load', start);
  
  // محاولة ثانية إذا كان التشغيل الأول فاشلاً
  setTimeout(() => {
    if (audio.paused && !hasExited) audio.play().catch(() => {});
  }, 600);
</script>
